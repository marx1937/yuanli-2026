<script>
    $(document).ready(function() {
        loadGallery();
    });

    function loadGallery() {
        let t = new Date().getTime();
        $.getJSON('/api/locations?t=' + t, function(data) {
            let html = '';
            
            if (data.length === 0) {
                $('#gallery-list').html('<div style="text-align:center; width:100%; margin-top:50px; color:#888;">還沒有資料喔！</div>');
                return;
            }

            data.reverse().forEach(item => {
                let name = item.nickname ? item.nickname.split("#")[0] : "熱心串友";
                let area = (item.nickname && item.nickname.includes("#")) ? item.nickname.split("#")[1] : (item.area || "苑裡");
                // 圖片優化：使用 Cloudinary 縮圖功能，加快載入速度
                let thumb = item.image_url.replace('/upload/', '/upload/w_300,h_300,c_fill,q_auto/');

                html += `
                    <div class="gallery-col">
                        <div class="photo-card" onclick='showDetail(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
                            <span class="photo-badge">${area}</span>
                            <div class="photo-img-container">
                                <img class="photo-img" src="${thumb}" loading="lazy">
                                <div class="photo-info-overlay">
                                    <i class="fas fa-user-circle"></i> ${name}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            $('#gallery-list').html(html);
        });
    }

    window.showDetail = function(item) {
        let name = item.nickname ? item.nickname.split("#")[0] : "熱心串友";
        let area = (item.nickname && item.nickname.includes("#")) ? item.nickname.split("#")[1] : (item.area || "苑裡");
        let note = (item.note && item.note.trim() !== "") ? item.note : "（無備註）";
        let time = item.created_at ? item.created_at.substring(0, 16) : "未知時間";
        
        // 1. Google 導航連結 (修正為絕對路徑)
        let navLink = `http://googleusercontent.com/maps.google.com/maps?daddr=${item.lat},${item.lng}`;
        let shareUrl = window.location.href; 

        // 2. LINE 專用文案：多行排版、豐富資訊 (使用 %0A 換行)
        // 這樣傳到 LINE 裡面會變得很整齊
        const lineGreetings = [
            `🔥 驚見野生土地公！`,
            `🙏 苑裡這裡有神明，有拜有保庇！`,
            `📍 尋神情報更新！發現新地點！`,
            `✨ 這尊土地公看起來很靈驗喔～`,
            `📸 鄉親啊～快來看看這個！`
        ];
        let randomGreeting = lineGreetings[Math.floor(Math.random() * lineGreetings.length)];
        
        let lineText = `${randomGreeting}%0A%0A` + 
                       `🗺️ 地點：${area}%0A` + 
                       `👤 拍攝：${name}%0A` + 
                       `💬 備註：${note}%0A%0A` + 
                       `👇 點我看地圖與照片：`;

        // 3. Facebook 連結 (FB API 不支援預填文字，只能純分享網址)
        let fbLink = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}`;
        
        // 4. LINE 連結 (文字 + 網址)
        let lineLink = `https://line.me/R/msg/text/?${lineText} ${encodeURIComponent(shareUrl)}`;

        Swal.fire({
            background: '#2c2c2c',
            html: `
                <div style="padding:0px;">
                    <img src="${item.image_url}" style="width:100%; border-radius:10px; border:2px solid #fff; margin-bottom:15px;">
                    
                    <div style="text-align:left; color:#fff;">
                        <div style="font-size:1.4rem; font-weight:bold; color:#ffca28; margin-bottom:5px;">
                            <i class="fas fa-map-marker-alt"></i> ${area}
                        </div>
                        <div style="font-size:0.95rem; color:#ccc; margin-bottom:10px;">
                            <i class="fas fa-camera"></i> 影像提供：${name}
                        </div>
                        
                        <div style="background:rgba(255,255,255,0.1); padding:10px; border-radius:8px; margin-bottom:5px;">
                            <i class="fas fa-quote-left" style="color:#aaa;"></i>
                            <span style="color:#fff; font-size:1rem; margin-left:5px;">${note}</span>
                        </div>
                        <div style="font-size:0.8rem; color:#777; text-align:right; margin-bottom:15px;">
                           ${time}
                        </div>
                    </div>

                    <div class="btn-group-custom">
                        <a href="${navLink}" target="_blank" class="btn-action btn-nav">
                            <i class="fas fa-location-arrow"></i> 導航
                        </a>
                        <a href="${lineLink}" target="_blank" class="btn-action btn-line">
                            <i class="fab fa-line"></i> LINE
                        </a>
                        <a href="${fbLink}" target="_blank" class="btn-action btn-fb">
                            <i class="fab fa-facebook-f"></i> FB
                        </a>
                    </div>
                </div>
            `,
            showConfirmButton: false,
            showCloseButton: true,
            customClass: { popup: 'custom-swal-popup' }
        });
    }
</script>
