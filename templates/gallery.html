{% extends "base.html" %}
{% set active_page = "gallery" %}

{% block styles %}
<style>
    /* 1. 還原經典網格排列 (兩欄式) */
    .gallery-row {
        display: flex;
        flex-wrap: wrap;
        margin: 0 -5px;
    }
    .gallery-col {
        flex: 0 0 50%; /* 一排兩張 */
        max-width: 50%;
        padding: 5px;
        margin-bottom: 10px;
    }
    @media (min-width: 768px) {
        .gallery-col { flex: 0 0 33.33%; max-width: 33.33%; } /* 電腦版一排三張 */
    }

    /* 2. 照片卡片樣式 */
    .photo-card {
        background: #fff;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        height: 100%;
        cursor: pointer;
        position: relative;
    }
    .photo-img-container {
        width: 100%;
        padding-top: 100%; /* 1:1 正方形裁切 */
        position: relative;
        background: #eee;
    }
    .photo-img {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
    }
    .photo-info-overlay {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
        padding: 20px 10px 5px 10px;
        color: white;
    }
    .photo-badge {
        background: #d32f2f; color: white;
        font-size: 0.75rem; padding: 2px 6px;
        border-radius: 4px; position: absolute; top: 10px; left: 10px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    /* 3. 頂部標題區 */
    .page-header { 
        text-align: center; 
        padding: 20px 0 10px 0; 
        width: 100%; 
        position: relative; 
    }

    /* 4. 深色彈窗樣式優化 */
    .custom-swal-popup {
        background: #2c2c2c !important;
        border: 1px solid #444 !important;
        border-radius: 15px !important;
        overflow: visible !important; /* 讓關閉按鈕可以突出去 */
    }
    .custom-swal-title { color: #ffca28 !important; text-align: left !important; font-size: 1.3rem !important; margin-bottom: 0 !important; }
    .custom-swal-content { color: #eee !important; text-align: left !important; font-size: 0.95rem !important; }

    /* 5. 修正後的關閉按鈕樣式 (紅底金字，像徽章) */
    div:where(.swal2-container) button.swal2-close {
        background: #d32f2f !important; /* 廟宇紅 */
        color: #ffca28 !important;      /* 招財金 */
        border: 2px solid #ffca28 !important; /* 金邊 */
        border-radius: 50%;
        width: 36px;
        height: 36px;
        position: absolute;
        top: -12px;
        right: -12px;
        box-shadow: 0 3px 8px rgba(0,0,0,0.4);
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        opacity: 1;
        outline: none;
    }
    /* 按下時的效果 */
    div:where(.swal2-container) button.swal2-close:active {
        transform: scale(0.9);
        background: #b71c1c !important;
    }
    
    /* 6. 按鈕群組 (修正配色) */
    .btn-group-custom { display: flex; gap: 8px; margin-top: 15px; }
    .btn-action { 
        flex: 1; 
        border-radius: 50px; 
        font-weight: bold; 
        padding: 10px 0; 
        border: none; 
        font-size: 0.9rem; 
        text-decoration: none; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        gap: 5px; 
        transition: opacity 0.2s;
    }
    .btn-action:hover { opacity: 0.9; text-decoration: none; color: inherit; }

    /* 配色方案修正 */
    .btn-nav { background: #d32f2f; color: #fff; } /* 廟宇紅 - 導航 */
    .btn-line { background: #ffca28; color: #5d4037; } /* 招財金 - LINE (字深褐) */
    .btn-fb { background: #5d4037; color: #fdfcf0; } /* 沈穩褐 - FB (字米白) */

</style>
{% endblock %}

{% block content %}

    <div class="page-header">
        <img src="https://res.cloudinary.com/diuoghid2/image/upload/v1768691402/title_signboard.png" 
             alt="尋神情報站"
             style="width: 95%; max-width: 600px; height: auto; object-fit: contain; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.2)); margin-bottom: 5px;">
    </div>

    <div class="container-fluid" style="padding-bottom: 100px;">
        <div class="gallery-row" id="gallery-list">
            <div style="text-align:center; width:100%; padding:40px; color:#999;">
                <i class="fas fa-spinner fa-spin"></i> 正在載入神明...
            </div>
        </div>
    </div>

{% endblock %}

{% block scripts %}
<script>
    $(document).ready(function() {
        loadGallery();
    });

    function loadGallery() {
        let t = new Date().getTime();
        $.getJSON('/api/locations?t=' + t, function(data) {
            let html = '';
            
            if (data.length === 0) {
                $('#gallery-list').html('<div style="text-align:center; width:100%; margin-top:50px; color:#888;">還沒有資料喔！</div>');
                return;
            }

            data.reverse().forEach(item => {
                let name = item.nickname ? item.nickname.split("#")[0] : "熱心串友";
                let area = (item.nickname && item.nickname.includes("#")) ? item.nickname.split("#")[1] : (item.area || "苑裡");
                let thumb = item.image_url.replace('/upload/', '/upload/w_300,h_300,c_fill,q_auto/');

                html += `
                    <div class="gallery-col">
                        <div class="photo-card" onclick='showDetail(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
                            <span class="photo-badge">${area}</span>
                            <div class="photo-img-container">
                                <img class="photo-img" src="${thumb}" loading="lazy">
                                <div class="photo-info-overlay">
                                    <i class="fas fa-user-circle"></i> ${name}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            $('#gallery-list').html(html);
        });
    }

    window.showDetail = function(item) {
        let name = item.nickname ? item.nickname.split("#")[0] : "熱心串友";
        let area = (item.nickname && item.nickname.includes("#")) ? item.nickname.split("#")[1] : (item.area || "苑裡");
        let note = (item.note && item.note.trim() !== "") ? item.note : "無備註";
        let time = item.created_at ? item.created_at.substring(0, 16) : "未知時間";
        
        // 🔥 修正導航連結：使用 Google Maps 官方 API 格式
        let navLink = `https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}`;
        let shareUrl = window.location.href; 

        // 🔥 隨機分享文案
        const shareMessages = [
            `我在尋神地圖發現了 ${area} 的神隊友！快來看！`,
            `尋神情報：${area} 這裡有一尊很靈驗的土地公喔！`,
            `有拜有保庇！我在 ${area} 幫大家祈福囉～🙏`,
            `發現野生神明！📍地點在 ${area}，點我導航！`,
            `苑裡尋神地圖：${area} 這裡風景不錯，還有神明保佑！`
        ];
        let shareText = shareMessages[Math.floor(Math.random() * shareMessages.length)];

        Swal.fire({
            background: '#2c2c2c',
            html: `
                <div style="padding:0px;">
                    <img src="${item.image_url}" style="width:100%; border-radius:10px; border:2px solid #fff; margin-bottom:15px;">
                    
                    <div style="text-align:left; color:#fff;">
                        <div style="font-size:1.4rem; font-weight:bold; color:#ffca28; margin-bottom:5px;">
                            <i class="fas fa-map-marker-alt"></i> ${area}
                        </div>
                        <div style="font-size:0.95rem; color:#ccc; margin-bottom:10px;">
                            <i class="fas fa-camera"></i> 影像提供：${name}
                        </div>
                        
                        <div style="background:rgba(255,255,255,0.1); padding:10px; border-radius:8px; margin-bottom:5px;">
                            <i class="fas fa-quote-left" style="color:#aaa;"></i>
                            <span style="color:#fff; font-size:1rem; margin-left:5px;">${note}</span>
                        </div>
                        <div style="font-size:0.8rem; color:#777; text-align:right; margin-bottom:15px;">
                           ${time}
                        </div>
                    </div>

                    <div class="btn-group-custom">
                        <a href="${navLink}" target="_blank" class="btn-action btn-nav">
                            <i class="fas fa-location-arrow"></i> 導航
                        </a>
                        <a href="https://line.me/R/msg/text/?${shareText} ${shareUrl}" target="_blank" class="btn-action btn-line">
                            <i class="fab fa-line"></i> LINE
                        </a>
                        <a href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}" target="_blank" class="btn-action btn-fb">
                            <i class="fab fa-facebook-f"></i> FB
                        </a>
                    </div>
                </div>
            `,
            showConfirmButton: false,
            showCloseButton: true,
            customClass: { popup: 'custom-swal-popup' }
        });
    }
</script>
{% endblock %}
